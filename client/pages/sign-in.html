<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Cindrome</title>
    <!-- استدعاء ملف الـ CSS الخاص بالصفحة -->
    <link rel="stylesheet" href="../css/pages/sign-in.css">
</head>

<body>

    <main class="auth-container">
        <!-- كارت التسجيل -->
        <div class="auth-card">

            <!-- اللوجو ورأس الكارت -->
            <div class="auth-header">
                <a href="../../index.html" class="auth-logo-link">
                    <img src="../assets/logos/no background logo.png" alt="Cindrome Logo" class="auth-logo">
                </a>
                <h1 class="auth-title">Welcome Back</h1>
                <p class="auth-subtitle">Sign in to continue to your Cindrome account</p>
            </div>

            <!-- نموذج الدخول -->
            <form class="auth-form" onSubmit="return false;">

                <!-- حقل البريد الإلكتروني -->
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="name@example.com" required autocomplete="email">
                </div>

                <!-- حقل كلمة السر -->
                <div class="form-group">
                    <div class="label-wrapper">
                        <label for="password">Password</label>
                        <a href="#" class="forgot-link">Forgot?</a>
                    </div>
                    <input type="password" id="password" placeholder="••••••••" required
                        autocomplete="current-password">
                </div>

                <!-- خيار تذكرني -->
                <!-- خيار تذكرني بستايل مودرن -->
                <div class="form-options">
                    <label class="toggle-container">
                        <input type="checkbox" id="remember">
                        <span class="toggle-slider"></span>
                        <span class="toggle-label">Remember me</span>
                    </label>
                </div>

                <!-- زرار تسجيل الدخول -->
                <button type="submit" class="auth-btn">Sign In</button>

            </form>

            <!-- رابط الانتقال لإنشاء حساب -->
            <div class="auth-footer">
                <p>Don't have an account? <a href="./sign-up.html">Sign up</a></p>
            </div>

        </div>
    </main>

</body>

</html>
