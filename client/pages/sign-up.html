<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Cindrome</title>
    <link rel="stylesheet" href="../css/pages/sign-up.css">
</head>

<body>

    <main class="auth-container signup-container">
        <div class="auth-card signup-card">

            <!-- Header -->
            <div class="auth-header">
                <a href="../../index.html" class="auth-logo-link">
                    <img src="../assets/logos/no background logo.png" alt="Cindrome Logo" class="auth-logo">
                </a>
                <h1 class="auth-title">Create Account</h1>
                <p class="auth-subtitle">Join Cindrome to track your movies & shows</p>
            </div>

            <!-- Form -->
            <form class="auth-form" onSubmit="return false;">

                <!-- صف عرضي للحقول: Username + Email -->
                <div class="form-row">
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" placeholder="Username" required autocomplete="username">
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" placeholder="name@example.com" required autocomplete="email">
                    </div>
                </div>

                <!-- صف عرضي للحقول: Password + Requirements -->
                <div class="form-row">
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" placeholder="••••••••" required
                            autocomplete="new-password">
                    </div>

                    <div class="password-requirements">
                        <p class="req-title">Password must contain:</p>
                        <ul class="req-list">
                            <li class="req-item"><span class="req-dot">•</span> Min 8 characters</li>
                            <li class="req-item"><span class="req-dot">•</span> Uppercase letter (A-Z)</li>
                            <li class="req-item"><span class="req-dot">•</span> Number or special character</li>
                        </ul>
                    </div>
                </div>

                <!-- Terms & Button Row -->
                <div class="signup-bottom-row">
                    <div class="form-options">
                        <label class="toggle-container">
                            <input type="checkbox" id="terms" required>
                            <span class="toggle-slider"></span>
                            <span class="toggle-label">I agree to Terms & Policy</span>
                        </label>
                    </div>

                    <button type="submit" class="auth-btn">Create Account</button>
                </div>

            </form>

            <!-- Footer -->
            <div class="auth-footer">
                <p>Already have an account? <a href="./sign-in.html">Sign in</a></p>
            </div>

        </div>
    </main>

</body>

</html>
