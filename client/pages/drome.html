<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cindrome - Drome AI</title>
    <link rel="icon" type="image/png" href="../assets/logos/cindrome-logo.png">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

        document.write(`
        <link rel="stylesheet" href="../css/main.css?v=${v}">
        <link rel="stylesheet" href="../css/navbar.css?v=${v}">
        <link rel="stylesheet" href="../css/pages/drome.css?v=${v}">
      `);
    </script>
</head>

<body class="drome-page">
    <header>
        <nav class="bar">
            <div class="nav-container">
                <a href="../../index.html" class="logo-link">
                    <img class="logo" src="../assets/logos/no background logo.png" alt="Cindrome Logo">
                </a>

                <input type="checkbox" id="menu-toggle" class="menu-checkbox">
                <label for="menu-toggle" class="hamburger-btn">&#9776;</label>

                <div class="right-bar">
                    <a href="./sign-in.html"><button class="signin-btn">Sign in</button></a>
                    <a href="../../index.html" class="nav-item">Home</a>
                    <a href="../pages/discover.html" class="nav-item">Discover</a>
                    <a href="../pages/lists.html" class="nav-item">Lists</a>
                    <div class="dropdown">
                        <input type="checkbox" id="content-toggle" class="dropdown-checkbox">
                        <label for="content-toggle" class="nav-item dropdown-label">Content ▾</label>
                        <ul class="dropdown-menu">
                            <li><a href="../pages/movies.html">Movies</a></li>
                            <li><a href="../pages/series.html">TV Series</a></li>
                            <li><a href="../pages/anime.html">Anime</a></li>
                        </ul>
                    </div>
                    <a href="../pages/drome.html" class="nav-item">Drome</a>
                    <div class="dropdown">
                        <input type="checkbox" id="account-toggle" class="dropdown-checkbox">
                        <label for="account-toggle" class="nav-item dropdown-label">Account ▾</label>
                        <ul class="dropdown-menu">
                            <li><a href="./profile.html">Profile</a></li>
                            <li><a href="diary.html">Diary</a></li>
                            <li><a href="./watchlist.html">Watchlist</a></li>
                            <li><a href="./sign-in.html">Log out</a></li>
                        </ul>
                    </div>
                </div>

                <button type="button" class="search-trigger-btn" aria-label="Search">
                    <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </button>
            </div>
        </nav>
    </header>

    <main class="drome-wrapper">
        <section class="drome-chat-area">
            <div class="chat-messages-container" id="chatContainer">
                <div class="chat-messages-inner" id="chatInner">
                    
                    <div id="pullToRefreshIndicator" class="pull-to-refresh-indicator">
                        <i class="fa-solid fa-arrow-down"></i> <span>Pull down</span>
                    </div>

                    <div class="drome-empty-state" id="emptyState">
                        <img src="../assets/logos/cindrome-logo.png" alt="Cindrome Logo" class="drome-large-logo">
                        <h2 class="drome-welcome-text">How can I help you discover today?</h2>
                        
                        <div class="suggested-prompts">
                            <button class="prompt-btn" onclick="fillInput('Suggest a movie with a mind-bending plot twist.')">
                                Suggest a movie with a mind-bending plot twist.
                            </button>
                            <button class="prompt-btn" onclick="fillInput('What should I watch after Dune?')">
                                What should I watch after Dune?
                            </button>
                        </div>
                    </div>

                    <div class="chat-bubble drome-chat-row typing-indicator-bubble" id="typingIndicator" style="display: none;">
                        <div class="drome-avatar">
                            <img src="../assets/logos/cindrome-logo.png" alt="Cindrome">
                        </div>
                        <div class="drome-bubble-content">
                            <div class="typing-dots">
                                <span class="dot"></span>
                                <span class="dot"></span>
                                <span class="dot"></span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="drome-input-wrapper">
                <div class="drome-input-box">
                    <button class="inline-icon-btn" onclick="clearChat()" title="New Chat">
                        <i class="fa-solid fa-plus"></i>
                    </button>

                    <div class="dropdowns-group">
                        <details class="css-dropdown" id="contentDropdown">
                            <summary class="dropdown-selected">
                                <span id="currentFocusText">Mixed</span>
                                <i class="fa-solid fa-chevron-up dropdown-arrow"></i>
                            </summary>
                            <ul class="dropdown-list">
                                <li class="dropdown-item" onclick="selectFocus('Mixed')">Mixed</li>
                                <li class="dropdown-item" onclick="selectFocus('Movies')">Movies</li>
                                <li class="dropdown-item" onclick="selectFocus('Series')">Series</li>
                                <li class="dropdown-item" onclick="selectFocus('Anime')">Anime</li>
                            </ul>
                        </details>
                    </div>

                    <textarea id="dromeInput" rows="1" placeholder="Type a message..." onkeydown="handleEnter(event)" oninput="autoResize(this)"></textarea>
                    
                    <button class="send-btn" id="mainSendBtn" onclick="toggleSendOrStop()">
                        <i class="fa-solid fa-arrow-up" id="sendBtnIcon"></i>
                    </button>
                </div>
                <p class="drome-disclaimer">Drome AI can make mistakes. Always check the ratings.</p>
            </div>
        </section>
    </main>

    <script>
        let isGenerating = false;
        let replyTimeout;

        function autoResize(textarea) {
            textarea.style.height = 'auto'; 
            textarea.style.height = textarea.scrollHeight + 'px'; 
        }

        function toggleSendOrStop() {
            if (isGenerating) {
                clearTimeout(replyTimeout);
                document.getElementById('typingIndicator').style.display = 'none';

                const chatInner = document.getElementById('chatInner');
                const typingIndicator = document.getElementById('typingIndicator');
                const stopBubble = document.createElement('div');
                stopBubble.className = 'chat-bubble';
                stopBubble.innerHTML = `
                    <div style="width: 100%; text-align: center; margin: 8px 0;">
                        <span style="background: rgba(255, 71, 87, 0.1); color: #ff4757; padding: 4px 12px; border-radius: 50px; font-size: 0.75rem; border: 1px solid rgba(255, 71, 87, 0.3);">
                            <i class="fa-solid fa-circle-exclamation" style="margin-right: 4px;"></i> Generation stopped
                        </span>
                    </div>
                `;
                chatInner.insertBefore(stopBubble, typingIndicator);

                const chatContainer = document.getElementById('chatContainer');
                chatContainer.scrollTop = chatContainer.scrollHeight; 

                finishGeneration();
            } else {
                sendMessage();
            }
        }

        function sendMessage() {
            const input = document.getElementById('dromeInput');
            if (input.value.trim() === '' || isGenerating) return;

            input.blur();

            isGenerating = true;
            updateInputUI();

            const chatInner = document.getElementById('chatInner');
            const emptyState = document.getElementById('emptyState');
            const typingIndicator = document.getElementById('typingIndicator');

            if (emptyState) emptyState.style.display = 'none';

            const userBubble = document.createElement('div');
            userBubble.className = 'chat-bubble user-chat-row';
            userBubble.innerHTML = `
                <div class="user-bubble-content">
                    <p>${input.value}</p>
                </div>
            `;
            chatInner.insertBefore(userBubble, typingIndicator);
            
            input.value = ''; 
            input.style.height = 'auto'; 

            typingIndicator.style.display = 'flex';
            
            const chatContainer = document.getElementById('chatContainer');
            chatContainer.scrollTop = chatContainer.scrollHeight; 

            replyTimeout = setTimeout(() => {
                typingIndicator.style.display = 'none'; 

                const dromeBubble = document.createElement('div');
                dromeBubble.className = 'chat-bubble drome-chat-row';
                dromeBubble.innerHTML = `
                    <div class="drome-avatar"><img src="../assets/logos/cindrome-logo.png" alt="Cindrome"></div>
                    <div class="drome-bubble-content">
                        <p>Based on your request, I highly recommend checking out <strong>Interstellar (2014)</strong>. It's a sci-fi masterpiece with stunning visuals and a great soundtrack by Hans Zimmer. The way it explores time dilation and black holes is unmatched in modern cinema.</p>
                    </div>
                `;
                chatInner.insertBefore(dromeBubble, typingIndicator);
                chatContainer.scrollTop = chatContainer.scrollHeight;

                finishGeneration();
            }, 3000); 
        }

        function finishGeneration() {
            isGenerating = false;
            updateInputUI();
        }

        function updateInputUI() {
            const sendBtnIcon = document.getElementById('sendBtnIcon');
            const inputField = document.getElementById('dromeInput');
            
            if (isGenerating) {
                sendBtnIcon.className = 'fa-solid fa-stop'; 
                inputField.readOnly = true; 
                inputField.placeholder = "Drome is thinking...";
                inputField.blur(); 
            } else {
                sendBtnIcon.className = 'fa-solid fa-arrow-up'; 
                inputField.readOnly = false; 
                inputField.placeholder = "Type a message...";
                inputField.blur(); 
            }
        }

        function fillInput(text) {
            if (isGenerating) return; 
            const inputField = document.getElementById('dromeInput');
            inputField.value = text;
            autoResize(inputField); 
            sendMessage();
        }

        function handleEnter(event) {
            if(event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault(); 
                if (isGenerating) return; 
                sendMessage();
            }
        }

        function clearChat() {
            const chatInner = document.getElementById('chatInner');
            const emptyState = document.getElementById('emptyState');
            
            const bubbles = chatInner.querySelectorAll('.chat-bubble:not(.typing-indicator-bubble)');
            bubbles.forEach(b => b.remove());
            
            if (emptyState) emptyState.style.display = 'block';
            const chatContainer = document.getElementById('chatContainer');
            chatContainer.scrollTop = 0;
        }

        function selectFocus(text) {
            document.getElementById('currentFocusText').textContent = text;
            document.getElementById('contentDropdown').removeAttribute('open');
        }

        document.addEventListener('click', function(event) {
            const dropdown = document.getElementById('contentDropdown');
            if (dropdown && dropdown.hasAttribute('open') && !dropdown.contains(event.target)) {
                dropdown.removeAttribute('open');
            }
        });

        // ==================================================
        // 🌟 برمجة الـ Pull to Refresh للموبايل 🌟
        // ==================================================
        let pStart = 0;
        let pCurrent = 0;
        const chatContainer = document.getElementById('chatContainer');
        const ptrIndicator = document.getElementById('pullToRefreshIndicator');

        chatContainer.addEventListener('touchstart', function(e) {
            // يبدأ يحسب السحب بس لو إنت في أول الصفحة فوق خالص
            if (chatContainer.scrollTop === 0) {
                pStart = e.touches[0].clientY;
            }
        }, {passive: true});

        chatContainer.addEventListener('touchmove', function(e) {
            if (chatContainer.scrollTop === 0 && pStart > 0) {
                pCurrent = e.touches[0].clientY;
                let pullDistance = pCurrent - pStart;
                
                // لو بيسحب لتحت
                if (pullDistance > 0) {
                    // تصعيب السحب شوية عشان ميبقاش سريع اوي
                    let height = Math.min(pullDistance * 0.4, 70); 
                    ptrIndicator.style.height = height + 'px';
                    
                    if (height >= 50) {
                        ptrIndicator.innerHTML = '<i class="fa-solid fa-plus"></i> <span>Release for new chat</span>';
                    } else {
                        ptrIndicator.innerHTML = '<i class="fa-solid fa-arrow-down"></i> <span>Pull down</span>';
                    }
                }
            }
        }, {passive: true});

        chatContainer.addEventListener('touchend', function(e) {
            if (pStart > 0 && pCurrent > 0) {
                let pullDistance = pCurrent - pStart;
                let height = Math.min(pullDistance * 0.4, 70); 
                
                // لو السحبة عدت الـ 50 بيكسل، نفذ أمر المسح
                if (height >= 50 && chatContainer.scrollTop === 0) {
                    ptrIndicator.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> <span>Starting...</span>';
                    setTimeout(() => {
                        clearChat();
                        resetPTR();
                    }, 400); // تأخير بسيط للأنيميشن
                } else {
                    resetPTR();
                }
            }
            pStart = 0;
            pCurrent = 0;
        });

        function resetPTR() {
            ptrIndicator.style.height = '0px';
        }

    </script>
</body>
</html>
