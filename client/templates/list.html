<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/list.css">
    <style>
        .list-card {
            margin: 0;
            width: 100%;
            max-width: 295px;
            padding: 14px;
        }

        .list-meta {
            margin-top: 5px;
            flex-wrap: nowrap;
            align-items: center;
        }

        .list-meta>div:first-child {
            display: flex;
            align-items: center;
            overflow: hidden;
            max-width: 60%;
        }

        .user-badge {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            display: inline-block;
        }

        .list-items-count {
            flex-shrink: 0;
            margin-left: 4px;
        }

        @media (max-width: 1000px) {
            .list-card {
                max-width: 220px;
                width: 100%;
                padding: 12px;
                gap: 10px;
            }

            .poster-stack {
                height: 140px;
            }

            .stack-poster {
                width: 85px;
                height: 120px;
                border-radius: 6px;
                box-shadow: -2px 4px 10px rgba(0, 0, 0, 0.5);
            }

            .stack-poster:nth-child(1) {
                left: calc(50% - 66px);
                top: 12px;
                transform: none;
            }

            .stack-poster:nth-child(2) {
                left: calc(50% - 50px);
                top: 8px;
                transform: scale(0.96);
            }

            .stack-poster:nth-child(3) {
                left: calc(50% - 34px);
                top: 4px;
                transform: scale(0.92);
            }

            .stack-poster:nth-child(4) {
                left: calc(50% - 18px);
                top: 0px;
                transform: scale(0.88);
            }

            .list-card:hover .stack-poster:nth-child(1) {
                transform: translate(-4px, 0) rotate(-6deg);
            }

            .list-card:hover .stack-poster:nth-child(2) {
                transform: translate(-1px, -2px) rotate(-2deg) scale(0.98);
            }

            .list-card:hover .stack-poster:nth-child(3) {
                transform: translate(3px, -3px) rotate(3deg) scale(0.96);
            }

            .list-card:hover .stack-poster:nth-child(4) {
                transform: translate(8px, -2px) rotate(6deg) scale(0.98);
            }

            /* تصغير الخطوط والأيقونات + تظبيط سطر اليوزر والزراير */
            .list-title {
                font-size: 14px;
                white-space: normal;
                line-height: 1.4;
            }

            .list-meta {
                font-size: 11px;
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
                margin-top: 4px;
            }

            .list-meta>div:first-child {
                width: 100%;
                max-width: 100%;
            }

            .list-actions {
                width: 100%;
                justify-content: flex-end;
                padding-top: 6px;
                border-top: 1px solid rgba(241, 227, 200, 0.05);
            }

            .list-action-btn {
                font-size: 11px;
                gap: 3px;
                padding: 2px;
            }

            .list-action-btn svg {
                width: 14px;
                height: 14px;
            }
        }
    </style>
</head>

<body>
    <div class="list-card">
        <div class="poster-stack">
            <img src="../assets/posters/poster-theboys.webp" alt="The Boys" class="stack-poster">
            <img src="../assets/posters/poster-onepiece.webp" alt="One Piece" class="stack-poster">
            <img src="../assets/posters/poster-spiderman.webp" alt="Spider-Man" class="stack-poster">
            <img src="../assets/posters/poster-odyssey.webp" alt="The Odyssey" class="stack-poster">
        </div>
        <div class="list-info">
            <a href="single-list.html" class="list-title">The Best Content Ever</a>
            <div class="list-meta">
                <div>
                    <span class="user-badge">By @Shehab</span>
                    <span class="list-items-count">• 4 Titles</span>
                </div>
                <div class="list-actions">
                    <button class="list-action-btn like-btn" title="Like List">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path
                                d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z">
                            </path>
                        </svg>
                        <span>1.2k</span>
                    </button>
                    <button class="list-action-btn comment-btn" title="Comment">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path
                                d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z">
                            </path>
                        </svg>
                        <span>84</span>
                    </button>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
